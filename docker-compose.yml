version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hotel-tracker-server
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - hotel-tracker-network
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hotel-tracker-client
    expose:
      - "3000"
    depends_on:
      - server
    networks:
      - hotel-tracker-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: hotel-tracker-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server
      - client
    networks:
      - hotel-tracker-network
    restart: unless-stopped

networks:
  hotel-tracker-network:
    driver: bridge
