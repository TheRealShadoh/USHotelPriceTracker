version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hotel-tracker-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    networks:
      - hotel-tracker-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hotel-tracker-client
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - hotel-tracker-network
    environment:
      - REACT_APP_API_URL=http://server:5000

networks:
  hotel-tracker-network:
    driver: bridge
